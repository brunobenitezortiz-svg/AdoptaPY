
name: adopta_mascotas
description: "AdoptaPY - Una nueva oportunidad para cada mascota."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Iconos
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Almacenamiento local
  shared_preferences: ^2.5.6

  # Diseño y sistema de colores
  flex_color_scheme: ^8.4.0

  # Tipografía
  google_fonts: ^8.2.1

  # Animaciones y microinteracciones
  flutter_animate: ^4.5.2

  # Pantallas de carga modernas
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
